<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
<title id="title">How radioactive dating estimates elapsed time</title>
<desc id="desc">An idealised closed-system example shows parent isotope remaining at 100, 50, 25 and 12.5 percent over three half-lives, followed by measurement and model-based interpretation. Radiocarbon dates require separate calendar calibration.</desc>
<rect width="1200" height="760" fill="#f8fafc"/>
<text x="65" y="83" font-family="Arial,sans-serif" font-size="40" font-weight="bold" fill="#172b42">How radioactive dating estimates elapsed time</text>
<text x="65" y="124" font-family="Arial,sans-serif" font-size="22" fill="#465b70">Idealised closed system · no initial daughter isotope · constant decay rate</text>
<g font-family="Arial,sans-serif">
<text x="70" y="198" font-size="26" font-weight="bold" fill="#172b42">1. Radioactive decay</text>
<g transform="translate(70,230)">
<rect x="0" y="0" width="220" height="200" rx="10" fill="white" stroke="#b8c7d5" stroke-width="2"/>
<rect x="40" y="20.0" width="140" height="140.0" fill="#2878a8"/>
<rect x="40" y="20" width="140" height="0.0" fill="#dfab62"/>
<text x="110" y="183" font-size="21" text-anchor="middle" fill="#172b42">0 half-lives</text>
<text x="110" y="220" font-size="20" text-anchor="middle" fill="#172b42">100% parent</text>
<rect x="260" y="0" width="220" height="200" rx="10" fill="white" stroke="#b8c7d5" stroke-width="2"/>
<rect x="300" y="90.0" width="140" height="70.0" fill="#2878a8"/>
<rect x="300" y="20" width="140" height="70.0" fill="#dfab62"/>
<text x="370" y="183" font-size="21" text-anchor="middle" fill="#172b42">1 half-life</text>
<text x="370" y="220" font-size="20" text-anchor="middle" fill="#172b42">50% parent</text>
<rect x="520" y="0" width="220" height="200" rx="10" fill="white" stroke="#b8c7d5" stroke-width="2"/>
<rect x="560" y="125.0" width="140" height="35.0" fill="#2878a8"/>
<rect x="560" y="20" width="140" height="105.0" fill="#dfab62"/>
<text x="630" y="183" font-size="21" text-anchor="middle" fill="#172b42">2 half-lives</text>
<text x="630" y="220" font-size="20" text-anchor="middle" fill="#172b42">25% parent</text>
<rect x="780" y="0" width="220" height="200" rx="10" fill="white" stroke="#b8c7d5" stroke-width="2"/>
<rect x="820" y="142.5" width="140" height="17.5" fill="#2878a8"/>
<rect x="820" y="20" width="140" height="122.5" fill="#dfab62"/>
<text x="890" y="183" font-size="21" text-anchor="middle" fill="#172b42">3 half-lives</text>
<text x="890" y="220" font-size="20" text-anchor="middle" fill="#172b42">12.5% parent</text>
</g>
<rect x="72" y="480" width="20" height="20" fill="#2878a8"/><text x="103" y="498" font-size="20" fill="#172b42">Parent isotope</text>
<rect x="302" y="480" width="20" height="20" fill="#dfab62"/><text x="333" y="498" font-size="20" fill="#172b42">Daughter product</text>
<path d="M65 535 H1135" stroke="#b8c7d5" stroke-width="2"/>
<text x="70" y="579" font-size="25" font-weight="bold" fill="#172b42">2. Measure isotopic evidence</text>
<text x="70" y="615" font-size="20" fill="#465b70">Determine isotope abundance or ratios using an appropriate analytical method.</text>
<text x="70" y="664" font-size="25" font-weight="bold" fill="#172b42">3. Interpret age with assumptions and calibration</text>
<text x="70" y="699" font-size="20" fill="#465b70">Account for initial conditions, contamination and uncertainty; radiocarbon ages also require calendar calibration.</text>
</g></svg>
