<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1150" viewBox="0 0 900 1150" role="img" aria-labelledby="title desc">
  <title id="title">Constraint-closed conceptual structure of APS</title>
  <desc id="desc">A simplified monochrome publication figure showing conceptual articulation among Tier 1 APS glossary terms.</desc>

  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M1.5,1.5 L9,5.5 L1.5,9 Z" fill="#111"/>
    </marker>
    <style>
      .node { fill: #ffffff; stroke: #111111; stroke-width: 2.2; }
      .node-strong { fill: #ffffff; stroke: #111111; stroke-width: 3.1; }
      .frame { fill: #ffffff; stroke: #555555; stroke-width: 1.8; }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 20px; font-weight: 700; text-anchor: middle; dominant-baseline: middle; fill: #111; letter-spacing: 0.2px; }
      .side { font-family: Arial, Helvetica, sans-serif; font-size: 16px; font-weight: 700; text-anchor: end; fill: #111; }
      .side2 { font-family: Arial, Helvetica, sans-serif; font-size: 13px; font-weight: 400; text-anchor: end; fill: #333; }
      .arrow { stroke: #111111; stroke-width: 2.0; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #111111; stroke-width: 1.8; fill: none; stroke-dasharray: 7 6; marker-end: url(#arrow); }
      .feedback { stroke: #111111; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .brace { stroke: #111111; stroke-width: 1.6; fill: none; }
      .caption-title { font-family: Arial, Helvetica, sans-serif; font-size: 17px; font-weight: 700; fill: #111; }
      .caption { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #111; }
    </style>
  </defs>

  <rect width="900" height="1150" fill="#ffffff"/>

  <!-- Framing nodes -->
  <rect x="255" y="55" width="190" height="58" rx="11" ry="11" class="frame"/>
  <text x="350" y="84" class="label">PROCESS</text>

  <rect x="505" y="55" width="190" height="58" rx="11" ry="11" class="frame"/>
  <text x="600" y="84" class="label">SCALE</text>

  <!-- Main conceptual chain -->
  <rect x="310" y="190" width="280" height="58" rx="11" ry="11" class="node"/>
  <text x="450" y="219" class="label">CONSTRAINT</text>

  <rect x="310" y="305" width="280" height="58" rx="11" ry="11" class="node-strong"/>
  <text x="450" y="334" class="label">CONSTRAINT CLOSURE</text>

  <rect x="310" y="420" width="280" height="58" rx="11" ry="11" class="node-strong"/>
  <text x="450" y="449" class="label">ORGANISATION</text>

  <rect x="310" y="535" width="280" height="58" rx="11" ry="11" class="node-strong"/>
  <text x="450" y="564" class="label">VIABILITY</text>

  <rect x="310" y="650" width="280" height="58" rx="11" ry="11" class="node"/>
  <text x="450" y="679" class="label">NORMATIVITY</text>

  <rect x="310" y="765" width="280" height="58" rx="11" ry="11" class="node"/>
  <text x="450" y="794" class="label">EVALUATION</text>

  <rect x="310" y="880" width="280" height="58" rx="11" ry="11" class="node"/>
  <text x="450" y="909" class="label">BIOLOGICAL AGENCY</text>

  <rect x="310" y="995" width="280" height="58" rx="11" ry="11" class="node"/>
  <text x="450" y="1024" class="label">FUNCTION</text>

  <rect x="310" y="1110" width="280" height="58" rx="11" ry="11" class="node"/>
  <text x="450" y="1139" class="label">PERSISTENCE</text>

  <!-- Framing arrows -->
  <path d="M350,113 C350,145 410,160 438,185" class="dashed"/>
  <path d="M600,113 C600,145 500,160 462,185" class="dashed"/>

  <!-- Main arrows -->
  <line x1="450" y1="248" x2="450" y2="300" class="arrow"/>
  <line x1="450" y1="363" x2="450" y2="415" class="arrow"/>
  <line x1="450" y1="478" x2="450" y2="530" class="arrow"/>
  <line x1="450" y1="593" x2="450" y2="645" class="arrow"/>
  <line x1="450" y1="708" x2="450" y2="760" class="arrow"/>
  <line x1="450" y1="823" x2="450" y2="875" class="arrow"/>
  <line x1="450" y1="938" x2="450" y2="990" class="arrow"/>
  <line x1="450" y1="1053" x2="450" y2="1105" class="arrow"/>

  <!-- Feedback loop -->
  <path d="M590,1139 C760,1098 765,680 745,560 C725,468 665,449 600,449" class="feedback"/>

  <!-- Side domain labels, minimal and monochrome -->
  <path d="M215,55 C195,55 195,113 215,113" class="brace"/>
  <text x="175" y="78" class="side">Framing</text>
  <text x="175" y="99" class="side2">conditions</text>

  <path d="M215,190 C195,190 195,478 215,478" class="brace"/>
  <text x="175" y="315" class="side">Structural</text>
  <text x="175" y="336" class="side2">constitution</text>

  <path d="M215,535 C195,535 195,708 215,708" class="brace"/>
  <text x="175" y="612" class="side">Normative</text>
  <text x="175" y="633" class="side2">significance</text>

  <path d="M215,765 C195,765 195,938 215,938" class="brace"/>
  <text x="175" y="842" class="side">Activity</text>
  <text x="175" y="863" class="side2">domain</text>

  <path d="M215,995 C195,995 195,1168 215,1168" class="brace"/>
  <text x="175" y="1072" class="side">Temporal</text>
  <text x="175" y="1093" class="side2">continuity</text>
</svg>