<?xml version="1.0" encoding="UTF-8"?>
<svg width="1800" height="1800" viewBox="0 0 1800 1800"
     xmlns="http://www.w3.org/2000/svg"
     role="img"
     aria-labelledby="title desc">
  <title id="title">APS Architecture Map — Navigating the Framework</title>
  <desc id="desc">
    A Level 2 APS architecture diagram showing six major explanatory pathways
    surrounding the APS core structure.
  </desc>

  <defs>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 54px; font-weight: 700; fill: #071b46; }
      .subtitle { font-size: 25px; font-style: italic; fill: #334155; }
      .legend { font-size: 20px; fill: #1e293b; }
      .path-title { font-size: 25px; font-weight: 700; }
      .path-body { font-size: 20px; fill: #111827; }
      .path-list { font-size: 18px; fill: #111827; }
      .focus { font-size: 19px; font-style: italic; }
      .core-title { font-size: 24px; font-weight: 700; fill: #071b46; }
      .core-label { font-size: 20px; font-weight: 700; }
      .core-main { font-size: 25px; font-weight: 700; fill: #071b46; }
      .core-small { font-size: 15px; font-weight: 600; fill: #334155; }
      .footer-title { font-size: 22px; font-weight: 700; fill: #071b46; }
      .footer-body { font-size: 18px; fill: #1e293b; }
      .footer-note { font-size: 18px; font-style: italic; fill: #334155; }
      .panel { stroke-width: 2.5; }
      .divider { stroke-width: 2; }
      .connector { fill: none; stroke: #64748b; stroke-width: 5; stroke-linecap: round; }
      .subtle-ring { fill: none; stroke: #cbd5e1; stroke-width: 2; opacity: 0.65; }
    </style>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#64748b" flood-opacity="0.16"/>
    </filter>
    <marker id="arrowGrey" markerWidth="12" markerHeight="10" refX="10" refY="5" orient="auto">
      <path d="M0,0 L12,5 L0,10 Z" fill="#64748b"/>
    </marker>
    <marker id="arrowGreyStart" markerWidth="12" markerHeight="10" refX="2" refY="5" orient="auto">
      <path d="M12,0 L0,5 L12,10 Z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="1800" height="1800" fill="#ffffff"/>

  <text x="900" y="70" text-anchor="middle" class="title">APS Architecture Map — Navigating the Framework</text>
  <text x="900" y="112" text-anchor="middle" class="subtitle">A viability-oriented framework for understanding life as organised persistence</text>
  <line x1="120" y1="150" x2="1680" y2="150" stroke="#cbd5e1" stroke-width="2"/>

  <path d="M145 198 L205 198" stroke="#94a3b8" stroke-width="6" marker-end="url(#arrowGrey)"/>
  <text x="235" y="190" class="legend">Arrows indicate explanatory</text>
  <text x="235" y="220" class="legend">dependence and feedback.</text>
  <circle cx="735" cy="198" r="29" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="10 8"/>
  <text x="790" y="190" class="legend">All pathways are grounded in</text>
  <text x="790" y="220" class="legend">the APS core structure.</text>
  <rect x="1260" y="175" width="72" height="42" rx="6" ry="6" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="1360" y="190" class="legend">Each pathway develops rich</text>
  <text x="1360" y="220" class="legend">concepts and articles.</text>

  <circle cx="900" cy="930" r="440" class="subtle-ring"/>
  <circle cx="900" cy="930" r="520" class="subtle-ring"/>

  <!-- 1 Biological Explanation -->
  <rect x="95" y="310" width="610" height="420" rx="38" fill="#f3fff5" stroke="#9acaa2" class="panel" filter="url(#softShadow)"/>
  <circle cx="170" cy="385" r="58" fill="#4f8f3a"/>
  <path d="M145 386 C150 355, 180 344, 205 360 C190 365, 174 383, 170 410 C161 400, 151 394, 145 386 Z" fill="#ffffff"/>
  <path d="M170 410 C170 392, 168 378, 160 365" stroke="#ffffff" stroke-width="4" fill="none"/>
  <text x="250" y="370" class="path-title" fill="#166534">1. BIOLOGICAL EXPLANATION</text>
  <text x="250" y="410" class="path-body">How APS understands explanation,</text>
  <text x="250" y="440" class="path-body">function, mechanism, and organisation.</text>
  <line x1="180" y1="475" x2="645" y2="475" stroke="#166534" class="divider"/>
  <text x="210" y="515" class="path-list">• Explanation and adequacy</text>
  <text x="210" y="548" class="path-list">• Function and teleonomy</text>
  <text x="210" y="581" class="path-list">• Mechanism and organisation</text>
  <text x="210" y="614" class="path-list">• Multiple realisation</text>
  <text x="210" y="647" class="path-list">• Explanatory grammar</text>
  <text x="180" y="695" class="focus" fill="#166534">Focus: What biological explanation is and how it works.</text>

  <!-- 2 Evolution -->
  <rect x="1095" y="310" width="610" height="420" rx="38" fill="#fff9e8" stroke="#f2c56d" class="panel" filter="url(#softShadow)"/>
  <circle cx="1170" cy="385" r="58" fill="#d9a51e"/>
  <path d="M1150 350 C1190 372, 1150 398, 1190 420" stroke="#ffffff" stroke-width="5" fill="none"/>
  <path d="M1190 350 C1150 372, 1190 398, 1150 420" stroke="#ffffff" stroke-width="5" fill="none"/>
  <line x1="1153" y1="368" x2="1187" y2="368" stroke="#ffffff" stroke-width="4"/>
  <line x1="1153" y1="386" x2="1187" y2="386" stroke="#ffffff" stroke-width="4"/>
  <line x1="1153" y1="404" x2="1187" y2="404" stroke="#ffffff" stroke-width="4"/>
  <text x="1250" y="370" class="path-title" fill="#b46b00">2. EVOLUTION</text>
  <text x="1250" y="410" class="path-body">The historical transformation of</text>
  <text x="1250" y="440" class="path-body">organised persistence.</text>
  <line x1="1180" y1="475" x2="1645" y2="475" stroke="#d97706" class="divider"/>
  <text x="1210" y="515" class="path-list">• Variation and inheritance</text>
  <text x="1210" y="548" class="path-list">• Adaptation and fitness</text>
  <text x="1210" y="581" class="path-list">• Natural selection</text>
  <text x="1210" y="614" class="path-list">• Development and continuity</text>
  <text x="1210" y="647" class="path-list">• Evolutionary transitions</text>
  <text x="1220" y="695" class="focus" fill="#b46b00">Focus: How living systems diversify and persist across generations.</text>

  <!-- 3 Cognition -->
  <rect x="1145" y="785" width="610" height="420" rx="38" fill="#fbf7ff" stroke="#cbb6df" class="panel" filter="url(#softShadow)"/>
  <circle cx="1220" cy="860" r="58" fill="#7c4d9e"/>
  <path d="M1195 860 C1188 830, 1235 825, 1238 850 C1265 850, 1265 890, 1234 886 C1223 906, 1188 894, 1195 860 Z" fill="none" stroke="#ffffff" stroke-width="5" stroke-linejoin="round"/>
  <text x="1300" y="845" class="path-title" fill="#512a75">3. COGNITION &amp; MEANING</text>
  <text x="1300" y="885" class="path-body">From evaluation to meaning,</text>
  <text x="1300" y="915" class="path-body">representation, and cognition.</text>
  <line x1="1230" y1="950" x2="1695" y2="950" stroke="#512a75" class="divider"/>
  <text x="1260" y="990" class="path-list">• Evaluation and semiosis</text>
  <text x="1260" y="1023" class="path-list">• Meaning and information</text>
  <text x="1260" y="1056" class="path-list">• Representation</text>
  <text x="1260" y="1089" class="path-list">• Cognition and intelligence</text>
  <text x="1260" y="1122" class="path-list">• Consciousness</text>
  <text x="1260" y="1170" class="focus" fill="#512a75">Focus: How organisms generate and use meaningful information.</text>

  <!-- 4 Diagnosis -->
  <rect x="1015" y="1230" width="610" height="420" rx="38" fill="#f2ffff" stroke="#8fcfd1" class="panel" filter="url(#softShadow)"/>
  <circle cx="1090" cy="1305" r="58" fill="#16979a"/>
  <path d="M1050 1305 L1073 1305 L1082 1278 L1100 1332 L1115 1295 L1130 1305 L1150 1305" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1170" y="1290" class="path-title" fill="#0f7b80">4. DIAGNOSIS &amp; MALFUNCTION</text>
  <text x="1170" y="1330" class="path-body">Understanding disruption, dysfunction,</text>
  <text x="1170" y="1360" class="path-body">and loss of viability.</text>
  <line x1="1100" y1="1395" x2="1565" y2="1395" stroke="#0f7b80" class="divider"/>
  <text x="1130" y="1435" class="path-list">• Perturbation and stress</text>
  <text x="1130" y="1468" class="path-list">• Malfunction and disease</text>
  <text x="1130" y="1501" class="path-list">• Constraint closure failure</text>
  <text x="1130" y="1534" class="path-list">• Biosignatures</text>
  <text x="1130" y="1567" class="path-list">• Repair and recovery</text>
  <text x="1130" y="1615" class="focus" fill="#0f7b80">Focus: When and why organised persistence breaks down.</text>

  <!-- 5 Ecology -->
  <rect x="175" y="1230" width="610" height="420" rx="38" fill="#fff6ef" stroke="#f2b288" class="panel" filter="url(#softShadow)"/>
  <circle cx="250" cy="1305" r="58" fill="#e46e1b"/>
  <path d="M250 1268 C220 1290, 220 1328, 250 1342 C280 1328, 280 1290, 250 1268 Z" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M230 1300 C248 1305, 260 1295, 270 1310" fill="none" stroke="#ffffff" stroke-width="4"/>
  <path d="M240 1330 C250 1315, 265 1320, 275 1305" fill="none" stroke="#ffffff" stroke-width="4"/>
  <text x="330" y="1290" class="path-title" fill="#c45100">5. ECOLOGY &amp; CONTEXT</text>
  <text x="330" y="1330" class="path-body">The role of environmental context</text>
  <text x="330" y="1360" class="path-body">in sustaining viable organisation.</text>
  <line x1="260" y1="1395" x2="725" y2="1395" stroke="#c45100" class="divider"/>
  <text x="290" y="1435" class="path-list">• System–environment interaction</text>
  <text x="290" y="1468" class="path-list">• Niche and ecological context</text>
  <text x="290" y="1501" class="path-list">• Resource flows and constraints</text>
  <text x="290" y="1534" class="path-list">• Community and interdependence</text>
  <text x="290" y="1567" class="path-list">• Ecological persistence</text>
  <text x="290" y="1615" class="focus" fill="#c45100">Focus: How ecological context shapes and sustains life.</text>

  <!-- 6 Philosophy -->
  <rect x="45" y="785" width="610" height="420" rx="38" fill="#f5f9ff" stroke="#a9c4e5" class="panel" filter="url(#softShadow)"/>
  <circle cx="120" cy="860" r="58" fill="#2f6fb8"/>
  <path d="M85 895 L155 895" stroke="#ffffff" stroke-width="6"/>
  <path d="M95 895 L95 840 L145 840 L145 895" fill="none" stroke="#ffffff" stroke-width="5"/>
  <path d="M80 840 L120 815 L160 840" fill="none" stroke="#ffffff" stroke-width="5"/>
  <line x1="110" y1="850" x2="110" y2="890" stroke="#ffffff" stroke-width="4"/>
  <line x1="130" y1="850" x2="130" y2="890" stroke="#ffffff" stroke-width="4"/>
  <text x="200" y="845" class="path-title" fill="#1f4f8f">6. PHILOSOPHY OF BIOLOGY</text>
  <text x="200" y="885" class="path-body">The conceptual and philosophical</text>
  <text x="200" y="915" class="path-body">foundations of APS.</text>
  <line x1="130" y1="950" x2="595" y2="950" stroke="#1f4f8f" class="divider"/>
  <text x="160" y="990" class="path-list">• Reductionism and holism</text>
  <text x="160" y="1023" class="path-list">• Autonomy and normativity</text>
  <text x="160" y="1056" class="path-list">• Explanation and ontology</text>
  <text x="160" y="1089" class="path-list">• Scientific realism</text>
  <text x="160" y="1122" class="path-list">• Philosophy of life</text>
  <text x="160" y="1170" class="focus" fill="#1f4f8f">Focus: The conceptual foundations of a science of life.</text>

  <!-- Central core -->
  <circle cx="900" cy="930" r="260" fill="#f8fafc" stroke="#071b46" stroke-width="5" filter="url(#softShadow)"/>
  <text x="900" y="780" text-anchor="middle" class="core-title">APS CORE STRUCTURE</text>
  <circle cx="900" cy="870" r="75" fill="#f2fff2" stroke="#166534" stroke-width="3"/>
  <circle cx="830" cy="980" r="75" fill="#f7fbff" stroke="#0f4c99" stroke-width="3"/>
  <circle cx="970" cy="980" r="75" fill="#fbf7ff" stroke="#512a75" stroke-width="3"/>
  <circle cx="900" cy="940" r="16" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
  <text x="900" y="890" text-anchor="middle" class="core-label" fill="#166534">AGENCY</text>
  <text x="830" y="1000" text-anchor="middle" class="core-label" fill="#0f4c99">PROCESS</text>
  <text x="970" y="1000" text-anchor="middle" class="core-label" fill="#512a75">SCALE</text>
  <text x="900" y="1090" text-anchor="middle" class="core-main">ORGANISED PERSISTENCE</text>
  <text x="900" y="1122" text-anchor="middle" class="core-small">Viability-oriented, constraint-closed</text>
  <text x="900" y="1146" text-anchor="middle" class="core-small">organisation sustained across time</text>

  <path d="M705 535 C790 610, 820 685, 815 735" class="connector" marker-end="url(#arrowGrey)" marker-start="url(#arrowGreyStart)"/>
  <path d="M1095 535 C1010 610, 980 685, 985 735" class="connector" marker-end="url(#arrowGrey)" marker-start="url(#arrowGreyStart)"/>
  <path d="M1145 995 C1085 990, 1120 930, 1162 930" class="connector" marker-end="url(#arrowGrey)" marker-start="url(#arrowGreyStart)"/>
  <path d="M1015 1435 C960 1350, 930 1260, 955 1188" class="connector" marker-end="url(#arrowGrey)" marker-start="url(#arrowGreyStart)"/>
  <path d="M785 1435 C840 1350, 870 1260, 845 1188" class="connector" marker-end="url(#arrowGrey)" marker-start="url(#arrowGreyStart)"/>
  <path d="M655 995 C720 995, 710 930, 638 930" class="connector" marker-end="url(#arrowGrey)" marker-start="url(#arrowGreyStart)"/>

  <rect x="120" y="1680" width="1560" height="82" rx="14" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
  <circle cx="185" cy="1721" r="35" fill="#ffffff" stroke="#64748b" stroke-width="4"/>
  <path d="M174 1734 L198 1707 L192 1730 L168 1751 Z" fill="none" stroke="#64748b" stroke-width="4" stroke-linejoin="round"/>
  <text x="245" y="1712" class="footer-title">HOW TO USE THIS MAP</text>
  <text x="520" y="1710" class="footer-body">Start with the core orientation pathway to understand the central structure of APS.</text>
  <text x="520" y="1742" class="footer-body">Then explore any pathway in depth. All pathways interconnect through the core.</text>
  <line x1="1310" y1="1695" x2="1310" y2="1755" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M1350 1710 L1410 1710" class="connector" marker-end="url(#arrowGrey)" marker-start="url(#arrowGreyStart)"/>
  <text x="1435" y="1717" class="footer-body">Mutual dependence</text>
  <path d="M1350 1745 L1410 1745" fill="none" stroke="#64748b" stroke-width="4" stroke-dasharray="10 8" marker-end="url(#arrowGrey)"/>
  <text x="1435" y="1752" class="footer-body">Contextual influence</text>
  <text x="900" y="1792" text-anchor="middle" class="footer-note">
    APS is an integrated framework: every pathway both depends on and contributes to the core structure.
  </text>
</svg>
