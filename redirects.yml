# APS Publishing Platform — Redirect Mappings
# Source of truth for URL redirects.
# Format: from -> to (301 permanent redirect)
# Build script generates Netlify _redirects or Vercel vercel.json from this file.
#
# Example:
# - from: "/old-path/"
#   to: "/new-path/"
#   status: 301
redirects:
  - from: "/inheritance-fitness-and-natural-selection/"
    to: "/variation-adaptation-fitness-selection/"
    status: 301

  - from: "/variation-fitness-and-natural-selection/"
    to: "/variation-adaptation-fitness-selection/"
    status: 301